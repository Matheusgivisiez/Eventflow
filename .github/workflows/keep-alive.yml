name: Keep API awake

# Ping o /api/health do Cloud Run a cada 10 minutos pra reduzir cold start
# (min-instances 0) durante a janela de vendas. Isso NAO resolve
# capacidade sob carga real - so evita o servidor "dormir" entre acessos.
# Remover se o Cloud Run passar a ter min-instances >= 1.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          set -e
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://eventflow-api-283790508777.us-east1.run.app/api/health)
          echo "status=$STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::API respondeu $STATUS em vez de 200"
          fi

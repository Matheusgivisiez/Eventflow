name: Deploy Web (Vercel)

# Roda sozinho depois que o deploy da API termina com sucesso, para o site
# novo nunca chamar uma API antiga. As variaveis do site (ex.:
# NEXT_PUBLIC_API_URL) ficam no painel do Vercel.
# Precisa do secret VERCEL_TOKEN no repositorio.

on:
  workflow_run:
    workflows: ["Deploy API (Cloud Run)"]
    types: [completed]
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_pN9NiuK6QYMHBDIFbnn7AOkM
  VERCEL_PROJECT_ID: prj_dw9CY4ZOjp9twqnqM1e7Gvb16rzO

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      # So publica commits que ja estao no master deste repositorio. Sem isso,
      # um PR vindo de fork (repo publico) com uma branch chamada "master"
      # dispara o CI, este workflow faz checkout do codigo do atacante e o
      # publica em producao com as credenciais do deploy.
      - name: Garantir que o commit esta no master
        run: |
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::Commit $(git rev-parse HEAD) nao esta no master deste repositorio. Deploy bloqueado."
            exit 1
          fi

      - name: Deploy de producao no Vercel
        run: npx --yes vercel@latest deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"

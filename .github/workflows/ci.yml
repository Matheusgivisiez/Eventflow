name: CI

on:
  push:
    branches: ["master", "main", "develop", "codex/**"]
  pull_request:

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.12.3"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --recursive lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @eventflow/api prisma:generate
      - run: pnpm --filter @eventflow/api exec tsc --noEmit
      - run: pnpm --filter @eventflow/web exec tsc --noEmit
      - run: pnpm --filter @eventflow/mobile exec tsc --noEmit

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eventflow
          POSTGRES_PASSWORD: eventflow
          POSTGRES_DB: eventflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @eventflow/api prisma:generate
      - run: pnpm --filter @eventflow/api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://eventflow:eventflow@localhost:5432/eventflow_test
      - run: pnpm --filter @eventflow/api prisma:seed
        env:
          DATABASE_URL: postgresql://eventflow:eventflow@localhost:5432/eventflow_test
      - run: pnpm --recursive test
        env:
          DATABASE_URL: postgresql://eventflow:eventflow@localhost:5432/eventflow_test
          REDIS_URL: redis://localhost:6379
      - run: pnpm --filter @eventflow/web exec playwright install --with-deps chromium --only-shell
      - run: pnpm --filter @eventflow/web test:e2e
        env:
          CI: true
          DATABASE_URL: postgresql://eventflow:eventflow@localhost:5432/eventflow_test
          REDIS_URL: redis://localhost:6379
          ABACATE_WEBHOOK_SECRET: eventflow-local-webhook-secret
          ABACATE_PUBLIC_KEY: eventflow-local-public-key

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @eventflow/api prisma:generate
      - run: pnpm build
      - run: git diff --check

  docker-build:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: eventflow-api:ci
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: eventflow-web:ci
      - name: Smoke test web container permissions and health
        run: |
          docker run --detach --name eventflow-web-ci --publish 3000:3000 \
            --env NEXT_PUBLIC_API_URL=http://127.0.0.1:3001/api \
            eventflow-web:ci
          trap 'docker logs eventflow-web-ci; docker rm --force eventflow-web-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000 >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              exit 1
            fi
            sleep 1
          done
          docker exec eventflow-web-ci sh -c \
            'test -r next.config.mjs && grep -q images.unsplash.com next.config.mjs && \
             mkdir -p .next/cache/ci-write && rmdir .next/cache/ci-write'
          if docker logs eventflow-web-ci 2>&1 | grep -q 'EACCES'; then
            echo 'Container emitted a filesystem permission error.' >&2
            exit 1
          fi

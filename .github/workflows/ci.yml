name: CI

on:
  push:
    branches: ["master", "main", "develop", "codex/**"]
  pull_request:

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.12.3"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --recursive lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @eventflow/api prisma:generate
      - run: pnpm --filter @eventflow/api exec tsc --noEmit
      - run: pnpm --filter @eventflow/web exec tsc --noEmit
      - run: pnpm --filter @eventflow/mobile exec tsc --noEmit

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eventflow
          POSTGRES_PASSWORD: eventflow
          POSTGRES_DB: eventflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @eventflow/api prisma:generate
      - run: pnpm --filter @eventflow/api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://eventflow:eventflow@localhost:5432/eventflow_test
      - run: pnpm --filter @eventflow/api prisma:seed
        env:
          DATABASE_URL: postgresql://eventflow:eventflow@localhost:5432/eventflow_test
      - run: pnpm --recursive test
        env:
          DATABASE_URL: postgresql://eventflow:eventflow@localhost:5432/eventflow_test
          REDIS_URL: redis://localhost:6379
      - run: pnpm --filter @eventflow/web exec playwright install --with-deps chromium --only-shell
      - run: pnpm --filter @eventflow/web test:e2e
        env:
          CI: true
          DATABASE_URL: postgresql://eventflow:eventflow@localhost:5432/eventflow_test
          REDIS_URL: redis://localhost:6379
          ABACATE_WEBHOOK_SECRET: eventflow-local-webhook-secret
          ABACATE_PUBLIC_KEY: eventflow-local-public-key

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @eventflow/api prisma:generate
      - run: pnpm build
      - run: git diff --check

  docker-build:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
            ghcr.io/${{ github.repository }}/api:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: |
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}
            ghcr.io/${{ github.repository }}/web:latest

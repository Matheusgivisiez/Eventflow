apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventhub-worker
  namespace: eventhub
spec:
  replicas: 4
  selector:
    matchLabels:
      app: eventhub-worker
  template:
    metadata:
      labels:
        app: eventhub-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/your-org/eventhub/api:latest
          command: ["node", "dist/worker.js"]
          envFrom:
            - secretRef:
                name: eventhub-api-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

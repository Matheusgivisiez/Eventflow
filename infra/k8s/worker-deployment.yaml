apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventflow-worker
  namespace: eventflow
spec:
  replicas: 4
  selector:
    matchLabels:
      app: eventflow-worker
  template:
    metadata:
      labels:
        app: eventflow-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/your-org/eventflow/api:latest
          command: ["node", "dist/worker.js"]
          envFrom:
            - secretRef:
                name: eventflow-api-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

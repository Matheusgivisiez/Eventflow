apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventflow-web
  namespace: eventflow
spec:
  replicas: 3
  selector:
    matchLabels:
      app: eventflow-web
  template:
    metadata:
      labels:
        app: eventflow-web
    spec:
      containers:
        - name: web
          image: ghcr.io/your-org/eventflow/web:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: eventflow-web-config
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: eventflow-web
  namespace: eventflow
spec:
  selector:
    app: eventflow-web
  ports:
    - port: 80
      targetPort: 3000

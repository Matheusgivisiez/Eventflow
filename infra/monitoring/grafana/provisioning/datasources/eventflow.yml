apiVersion: 1

datasources:
  - name: Prometheus
    uid: eventflow-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
  - name: Loki
    uid: eventflow-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false

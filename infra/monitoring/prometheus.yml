global:
  scrape_interval: 15s

scrape_configs:
  - job_name: eventhub-api
    metrics_path: /api/metrics
    static_configs:
      - targets: ["api:3001"]
  - job_name: eventhub-web
    static_configs:
      - targets: ["web:3000"]
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
